<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clippy - OBS background</title>
<style>
  /* the page itself stays transparent so OBS gets real alpha when the Bliss image is switched off */
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  #shake { position: absolute; inset: 0; background: url("assets/bliss_clean.png") center / cover no-repeat; }
  #shake.nobg { background: none; }
  #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  /* Classic Office Assistant balloon */
  .balloon { position: absolute; max-width: 560px; background: #ffffe1; color: #000; border: 1.5px solid #000; border-radius: 12px;
             padding: 18px 24px; font: 27px/1.32 Tahoma, Verdana, "Segoe UI", sans-serif; box-shadow: 4px 5px 0 rgba(0,0,0,.28); z-index: 2; }
  .balloon[hidden] { display: none; }
  .balloon::before { content: ""; position: absolute; left: 34px; bottom: -24px; border: 12px solid transparent; border-top-color: #000; border-bottom: 0; }
  .balloon::after  { content: ""; position: absolute; left: 36px; bottom: -20px; border: 10px solid transparent; border-top-color: #ffffe1; border-bottom: 0; }
  .balloon.flip::before { left: auto; right: 34px; }
  .balloon.flip::after  { left: auto; right: 36px; }
  .balloon-text { white-space: pre-wrap; }
  .balloon-opts { list-style: none; margin: 14px 0 0; padding: 0; }
  .balloon-opts li { position: relative; padding-left: 40px; margin: 9px 0; }
  .balloon-opts li::before { content: ""; position: absolute; left: 6px; top: 7px; width: 16px; height: 16px; border-radius: 50%;
                             border: 2.5px solid #0a246a; background: #fff; box-sizing: border-box; }
  .balloon-opts li:first-child::before { background: radial-gradient(circle, #0a246a 0 38%, #fff 42%); }

  #hint { position: absolute; left: 12px; top: 12px; font: 14px monospace; color: #fff; background: rgba(0,0,0,.55); padding: 6px 10px; border-radius: 6px; display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="shake">
    <svg id="scene" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="balloon" class="balloon" hidden></div>
  </div>
</div>
<div id="hint"></div>
<script src="clippy.js"></script>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const stage = document.getElementById('stage'), shake = document.getElementById('shake');

  // The stage is a fixed 1920x1080 canvas scaled to whatever size the browser source has.
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + ((innerWidth - 1920 * s) / 2) + 'px,' + ((innerHeight - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();
  const bgLocked = q.has('bg');                      // ?bg=0 on the URL beats the board's toggle
  if (q.get('bg') === '0') shake.classList.add('nobg');

  Clippy.init({
    svg: document.getElementById('scene'), stage: stage, shake: shake, balloon: document.getElementById('balloon'),
    pos: q.get('pos') || undefined, x: q.get('x') || undefined, scale: q.get('scale') || undefined,
    autoIdle: q.has('idle') ? q.get('idle') !== '0' : undefined,
    sound: q.has('sound') ? q.get('sound') === '1' : undefined,
    lock: [q.has('idle') ? 'autoIdle' : null, q.has('sound') ? 'sound' : null].filter(Boolean),   // URL switches beat the board's saved settings
  });
  // test hook: ?run=<action>&at=<ms> plays an action after load (used by tools/snap.py)
  if (q.get('run')) setTimeout(() => Clippy.run(q.get('run'), Object.fromEntries(q.entries())), +(q.get('at') || 200));

  // ---- link to the control board (server-sent events from server.py, plus same-browser fallbacks)
  const server = q.get('server') || (location.protocol.indexOf('http') === 0 ? '' : 'http://127.0.0.1:8787');
  const hint = document.getElementById('hint'), debug = q.get('debug') === '1';
  function note(t) { if (!debug) return; hint.style.display = 'block'; hint.textContent = t; }
  function handle(msg) {
    if (!msg) return;
    const off = v => v === false || v === 0 || v === 'false' || v === '0';
    if (msg.type === 'state') { Clippy.applyState(msg.state); if (!bgLocked && msg.state && 'bg' in msg.state) shake.classList.toggle('nobg', off(msg.state.bg)); return; }
    if (msg.action === 'bg') { if (!bgLocked) shake.classList.toggle('nobg', off(msg.value)); return; }
    if (msg.action) Clippy.run(msg.action, msg);
  }
  try {
    if (q.get('nolink') === '1') throw new Error('link disabled');
    const es = new EventSource(server + '/events');
    es.onopen = () => note('board link: connected');
    es.onerror = () => note('board link: waiting for server.py (run start.cmd)');
    es.onmessage = e => { try { handle(JSON.parse(e.data)); } catch (err) { console.warn(err); } };
  } catch (e) { note('no EventSource: ' + e); }
  try { new BroadcastChannel('clippy-board').onmessage = e => handle(e.data); } catch (e) {}
  addEventListener('storage', e => { if (e.key === 'clippy-msg' && e.newValue) { try { handle(JSON.parse(e.newValue).msg); } catch (err) {} } });
  window.handleClippyMessage = handle;   // handy for testing from the console
})();
</script>
</body>
</html>
